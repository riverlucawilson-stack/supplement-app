# BLANK VITAMIN B12 PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/vitamin-b12/
#   2. Rename it, e.g. brandname-b12-1000-mcg.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].

category: vitamin-b12

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: tablet                   # softgel | capsule | tablet | gummy | liquid | powder (lozenges count as tablet)
b12_form: methylcobalamin      # methylcobalamin | cyanocobalamin | adenosylcobalamin | hydroxocobalamin | mixed | other
# delivery: sublingual          # only if the label says how it is taken (sublingual, chewable, spray). Otherwise delete this line.
other_ingredients: []          # everything else, e.g. [microcrystalline cellulose, stearic acid]

dose:                          # from the Supplement Facts panel
  units_per_serving: 0         # tablets / lozenges / gummies / drops / sprays in one serving
  vitamin_b12_per_serving_mcg: 0 # the B12 mcg figure on the Supplement Facts panel
  # folate_per_serving_mcg_dfe: 0 # only if the label lists folate in mcg DFE. Otherwise delete this line.
  servings_per_container: 0    # as printed on the label

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01
    # rating:                  # optional: the store's own review summary
    #   stars: 4.7
    #   count: 1234

# --- Only from the certifier's own website ---
certifications: []
#  - program: USP Verified     # NSF Certified for Sport | Informed Sport | USP Verified | BSCG | Clean Label Project
#    listing_url: https://
#    date_verified: 2026-01-01

# --- Certificate of analysis (lab report) ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [potency, lead, arsenic, cadmium, mercury, microbial]

flags: []                      # e.g. [added sugars, contains soy]
notes: ""
