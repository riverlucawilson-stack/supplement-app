# BLANK PROTEIN POWDER PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/protein-powder/
#   2. Rename it, e.g. brandname-whey-isolate-chocolate-2-lb.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].

category: protein-powder

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: powder
protein_source: whey_isolate   # whey_concentrate | whey_isolate | whey_blend | whey_hydrolysate | casein | milk_protein | egg | beef | collagen | pea | soy | plant_blend | animal_blend | other
# sources_listed: whey isolate, whey concentrate   # only for a blend: every protein the label lists. Otherwise delete this line.
flavor: ""                     # the flavor whose label and prices this file uses
other_ingredients: []          # everything else, e.g. [cocoa, natural flavors, sucralose]

dose:                          # from the Nutrition Facts / Supplement Facts panel
  serving_size_g: 0            # scoop weight in grams
  protein_per_serving_g: 0     # the "Protein" line
  servings_per_container: 0    # as printed on the label (often "about 30")

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01

# --- Only from the certifier's own website ---
certifications: []
#  - program: NSF Certified for Sport   # NSF Certified for Sport | Informed Sport | USP Verified | BSCG | Clean Label Project
#    listing_url: https://
#    date_verified: 2026-01-01

# --- Certificate of analysis (lab report), e.g. a brand's published heavy-metal results ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [potency, amino_profile, lead, arsenic, cadmium, mercury, microbial, banned_substances]

flags: []                      # e.g. [added sugars, contains milk, contains soy, sucralose]
notes: ""
