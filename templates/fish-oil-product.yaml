# BLANK FISH OIL / OMEGA-3 PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/fish-oil/
#   2. Rename it, e.g. brandname-omega-3-1280-mg-120-softgels.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].

category: fish-oil

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: softgel                  # softgel | capsule | gummy | liquid | tablet | powder
oil_form: triglyceride         # triglyceride | rtg | ethyl_ester | phospholipid | not_stated
# oil_source: anchovy, sardine # as the label says. Otherwise delete this line.
# totox_published: TOTOX 8 (lot 12345)   # only a value the brand or IFOS publishes. Otherwise delete this line.
other_ingredients: []          # everything else, e.g. [gelatin, glycerin, natural lemon flavor]

dose:                          # from the Supplement Facts panel
  units_per_serving: 0         # softgels / capsules / teaspoons in one serving
  epa_per_serving_mg: 0        # the "EPA" line, NEVER the total fish oil weight
  dha_per_serving_mg: 0        # the "DHA" line
  # total_omega3_per_serving_mg: 0   # only if the label lists total omega-3s
  servings_per_container: 0    # as printed on the label

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01

# --- Only from the certifier's own website (IFOS: the product's page on its consumer report site) ---
certifications: []
#  - program: IFOS            # IFOS | NSF Certified for Sport | Informed Sport | USP Verified | BSCG | Clean Label Project
#    listing_url: https://
#    date_verified: 2026-01-01

# --- Certificate of analysis (lab report) ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [potency, totox, peroxide, anisidine, pcbs, dioxins, lead, arsenic, cadmium, mercury]

flags: []                      # e.g. [contains fish, added sugars]
notes: ""
