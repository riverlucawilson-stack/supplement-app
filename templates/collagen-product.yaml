# BLANK COLLAGEN PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/collagen/
#   2. Rename it, e.g. brandname-collagen-peptides-unflavored-20-oz.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].
# Leave out undenatured type II collagen (e.g. UC-II, milligram doses): it's a different product.

category: collagen

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: powder                   # powder | capsule | tablet | gummy | liquid
collagen_source: bovine        # bovine | marine | porcine | chicken | eggshell_membrane | blend | other
# collagen_types: Types I and III        # only as the label lists them. Otherwise delete this line.
# branded_ingredient: Verisol             # only if the label names one. Otherwise delete this line.
# flavor: Unflavored                      # powders: the flavor this file's prices are for
# sources_listed: bovine, marine          # only for a blend. Otherwise delete this line.
other_ingredients: []          # everything else, e.g. [natural flavors, stevia leaf extract]

dose:                          # from the Supplement or Nutrition Facts panel
  # units_per_serving: 2       # capsules/tablets/scoops in one serving. Delete for powders measured in grams only.
  serving_size_g: 0            # the serving weight in grams, if printed. Otherwise delete this line.
  collagen_per_serving_g: 0    # the collagen (peptides) line in grams, NOT the scoop weight or total protein
  servings_per_container: 0    # as printed on the label

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01
    # rating:                  # optional: the store's own review summary
    #   stars: 4.7
    #   count: 1234

# --- Only from the certifier's own website ---
certifications: []
#  - program: NSF Certified for Sport   # NSF Certified for Sport | Informed Sport | USP Verified | BSCG | Clean Label Project
#    listing_url: https://
#    date_verified: 2026-01-01

# --- Certificate of analysis (lab report) ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [potency, lead, arsenic, cadmium, mercury, microbial]

flags: []                      # e.g. [added sugars, contains fish]
notes: ""
