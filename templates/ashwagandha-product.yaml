# BLANK ASHWAGANDHA PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/ashwagandha/
#   2. Rename it, e.g. brandname-ksm-66-ashwagandha.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].

category: ashwagandha

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: capsule                  # capsule | tablet | gummy | powder
ashwagandha_type: root_extract # root_extract | root_leaf_extract | root_powder | other
# extract: KSM-66              # only if the label names a branded extract. Otherwise delete this line.
other_ingredients: []          # everything else in the product, e.g. [black pepper extract, rice flour]

dose:                          # from the Supplement Facts panel
  units_per_serving: 0         # capsules / tablets / gummies / scoops in one serving
  ashwagandha_per_serving_mg: 0  # mg of ashwagandha (extract or powder) in one serving
  # withanolides_percent: 5    # only if the label states it. Otherwise delete this line.
  servings_per_container: 0    # as printed on the label

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01
    # rating:                  # optional: the store's own review summary
    #   stars: 4.7
    #   count: 1234

# --- Only from the certifier's own website ---
certifications: []
#  - program: NSF Certified for Sport   # NSF Certified for Sport | Informed Sport | USP Verified | BSCG | Clean Label Project
#    listing_url: https://
#    date_verified: 2026-01-01

# --- Certificate of analysis (lab report) ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [withanolides, identity, lead, arsenic, cadmium, mercury, microbial, pesticides, residual_solvents, aflatoxins]

flags: []                      # e.g. [contains black pepper extract, proprietary blend]
notes: ""
