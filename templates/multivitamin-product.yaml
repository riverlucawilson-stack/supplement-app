# BLANK MULTIVITAMIN PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/multivitamin/
#   2. Rename it, e.g. brandname-womens-multi-120-tablets.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].

category: multivitamin

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: tablet                   # tablet | capsule | softgel | gummy | powder | liquid
formula_for: adults            # adults | women | men | women_50_plus | men_50_plus | adults_50_plus | prenatal | other
# folate_form: folic acid      # as the label names it. Otherwise delete this line.
# b12_form: cyanocobalamin     # as the label names it. Otherwise delete this line.
# vitamin_d_form: D3 (cholecalciferol)   # as the label names it. Otherwise delete this line.
other_ingredients: []

dose:                          # from the Supplement Facts panel, per daily serving
  units_per_serving: 0         # tablets / gummies in one daily serving
  nutrients_at_100_dv: 0       # count of lines whose %DV is 100% or more
  # folate_mcg_dfe: 0          # the folate line in mcg DFE
  # vitamin_b12_mcg: 0
  # vitamin_d_mcg: 0           # mcg, not IU
  # iron_mg: 0                 # only if the label lists iron
  servings_per_container: 0    # as printed on the label

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # daily servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01

# --- Only from the certifier's own website ---
certifications: []
#  - program: USP Verified      # NSF Certified for Sport | Informed Sport | USP Verified | BSCG | Clean Label Project
#    listing_url: https://
#    date_verified: 2026-01-01

# --- Certificate of analysis (lab report) ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [potency, identity, lead, arsenic, cadmium, mercury, microbial, disintegration]

flags: []                      # e.g. [contains iron, added sugars, contains soy]
notes: ""
