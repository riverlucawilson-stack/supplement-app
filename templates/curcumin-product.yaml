# BLANK CURCUMIN / TURMERIC PRODUCT TEMPLATE
#
# How to use it:
#   1. Copy this file into src/content/products/curcumin/
#   2. Rename it, e.g. brandname-curcumin-c3-complex-120-capsules.yaml (lowercase, dashes)
#   3. Fill in every field from the sources named in the comments
#   4. Delete any example lines you didn't use
#   5. Run: npm run validate
#
# Only enter what you have seen yourself on the label, the seller's page,
# the certifier's site, or the COA. If you can't find something, leave it out
# (for optional fields) or leave the list empty with [].

category: curcumin

# --- From the product label or the brand's product page ---
brand: ""
name: ""
form: capsule                  # capsule | tablet | softgel | gummy | powder | liquid
formulation: extract_95        # extract_95 | extract_with_piperine | phytosome | enhanced | root_powder | root_and_extract | other
# branded_ingredient: C3 Complex          # only if the label names one. Otherwise delete this line.
# absorption_claim: '"…" (brand page)'    # quoted, with where it came from. Otherwise delete this line.
other_ingredients: []          # everything else

dose:                          # from the Supplement Facts panel
  units_per_serving: 1
  curcuminoids_per_serving_mg: 0   # curcuminoids as stated on the label. DELETE this line if the label doesn't state them.
  # turmeric_per_serving_mg: 0     # turmeric/extract weight as labeled (reference only)
  # piperine_per_serving_mg: 0     # piperine / black pepper extract, if listed
  servings_per_container: 0    # as printed on the label

# --- From each retailer's product page. One block per store and size. ---
prices:
  - retailer: ""
    price_usd: 0
    servings: 0                # servings in the container THIS store sells
    url: https://
    date_checked: 2026-01-01

# --- Only from the certifier's own website ---
certifications: []

# --- Certificate of analysis (lab report) ---
coas: []
#  - url: https://
#    lab: ""
#    iso_17025: unknown        # yes | no | unknown
#    lot: ""
#    test_date: 2026-01-01
#    scope: finished_product   # finished_product | raw_material
#    tests: [potency, identity, lead, arsenic, cadmium, mercury, microbial]

flags: []                      # e.g. [curcuminoid content not stated, contains black pepper extract]
notes: ""
