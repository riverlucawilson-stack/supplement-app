# MISSING: oil_source left out. Vitacost lists "anchovy, jack mackerel, mackerel, sardine"; NIH label (older version) lists anchovy only. Pages conflict.
other_ingredients: [highly refined fish oil concentrate (from one or more anchovy, jack mackerel, mackerel, sardine), gelatin, glycerin, enteric coating, purified water, silica, beeswax, caramel color, natural flavor, sunflower lecithin, mixed tocopherols, maltodextrin, rosemary extract]   # Vitacost "Other ingredients"

dose:
  units_per_serving: 2          # Vitacost: "Serving Size: 2 Enteric Coated Softgels"
  epa_per_serving_mg: 700       # Vitacost Supplement Facts "EPA"
  dha_per_serving_mg: 500       # Vitacost Supplement Facts "DHA"
  # MISSING: total omega-3 line not stated on the Vitacost label (Pure+ Wild Fish Oil Concentrate 2000 mg is the oil weight)
  servings_per_container: 60    # Vitacost Supplement Facts. Key info box says "Total servings 120 count", which is the softgel count.

prices:
